<style>
  /* Pair views are HTML fragments injected into Homey's own page — no doctype/head/body,
     and no /homey.js include (Homey provides the object + calls onHomeyReady). */
  #navien-start { max-width:520px; margin:0 auto; padding:24px 16px; text-align:center;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:#1b1b1f; }
  #navien-start .card { background:#fff; border:1px solid #e2e2e8; border-radius:10px; padding:24px 16px; }
  #navien-start p { margin:0 0 14px; color:#66666e; }
  #navien-start button { padding:10px 18px; border:0; border-radius:6px; background:#E2001A; color:#fff;
    font-size:15px; cursor:pointer; }
  #navien-start .spinner { display:inline-block; width:18px; height:18px; border:3px solid #d9d9e0;
    border-top-color:#E2001A; border-radius:50%; animation:navspin .8s linear infinite; }
  @keyframes navspin { to { transform:rotate(360deg); } }
</style>

<div id="navien-start">
  <div class="card">
    <p id="msg"><span class="spinner"></span></p>
    <button id="recheck" style="display:none" data-i18n="recheck">Check again</button>
  </div>
</div>

<script type="text/javascript">
  // Strings live here rather than in locales/*.json because a pair view is a raw fragment:
  // Homey does not run its own i18n over it, and there is no build step to inline one.
  // English is the default, so a Homey whose language we cannot read still reads.
  var STR = {
    en: { recheck:"Check again",
          need:"Sign in with your Navien account in the app settings first.",
          hint:"Open this app's settings in Homey, sign in with your Navien Smart account, then come back here and press ‘Check again’." },
    ko: { recheck:"다시 확인",
          need:"먼저 앱 설정에서 나비엔 계정으로 로그인하세요.",
          hint:"Homey 앱에서 이 앱의 설정을 열어 나비엔 스마트 계정으로 로그인한 뒤, 이 화면으로 돌아와 ‘다시 확인’을 눌러 주세요." }
  };
  var LANG = "en";
  function t(k) { return (STR[LANG] && STR[LANG][k]) || STR.en[k] || k; }

  // **`getLanguage()` returns a Promise** on current Homey builds, and `Homey.language` is
  // only set once i18n has loaded. Reading the return value as a string — as 0.6.5 did —
  // turned it into "[o", fell through to English, and *reported* English, which the app then
  // stored as the user's language: every status label on every device went English. Walk all
  // the shapes, then the browser's own setting. `REPORTED` stays "" when nothing answered,
  // so a guess is never sent to the app as if it were the user's choice.
  var REPORTED = "";
  function resolveLang(ref) {
    return new Promise(function (resolve) {
      var settled = false;
      function done(value) {
        if (settled) return;
        settled = true;
        var raw = typeof value === "string" && value ? value : "";
        if (!raw) { try { raw = navigator.language || ""; } catch (e) { /* ignore */ } }
        var code = String(raw).slice(0, 2).toLowerCase();
        if (STR[code]) { LANG = code; REPORTED = code; }
        resolve(LANG);
      }
      try {
        if (ref && typeof ref.language === "string" && ref.language) return done(ref.language);
        var maybe = ref && typeof ref.getLanguage === "function"
          ? ref.getLanguage(function (err, value) { done(err ? null : value); }) : null;
        if (maybe && typeof maybe.then === "function") return maybe.then(done, function () { done(null); });
        if (typeof maybe === "string") return done(maybe);
      } catch (e) { /* fall through */ }
      // Never block the view on a lookup that may never answer.
      setTimeout(function () { done(null); }, 1500);
    });
  }

  function applyI18n() {
    var nodes = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
    }
  }

  // onHomeyReady is unreliable across Homey versions, and the Homey global starts life
  // as a constructor whose ready instance arrives later — so trigger init through every
  // mechanism, check that ready/emit are actually functions, and let `started` dedupe.
  var started = false, H = null;
  function usable(o) { return !!o && typeof o.ready === "function" && typeof o.emit === "function"; }

  function run(homeyObj) {
    if (started) return;
    var ref = usable(homeyObj) ? homeyObj
            : (typeof Homey !== "undefined" && usable(Homey) ? Homey : null);
    if (!ref) return;
    if (!document.getElementById("msg")) return;
    started = true; H = ref;
    try { H.ready(); } catch (e) { /* ignore */ }
    resolveLang(ref).then(function () { applyI18n(); flow(); });
  }

  function flow() {
    var msg = document.getElementById("msg");
    var btn = document.getElementById("recheck");
    var done = false;

    // Login happens only in the app settings — this pair view just checks whether an
    // account is already saved and, if so, goes straight to the device list.
    function toList() { if (done) return; done = true; H.showView("list_devices"); }

    function guide(reason) {
      if (done) return;
      msg.innerHTML = "";
      var line = document.createElement("div");
      line.style.cssText = "font-weight:600;";
      line.textContent = reason || t("need");
      var hint = document.createElement("div");
      hint.style.cssText = "margin-top:10px;font-size:13px;color:#8a8a92;line-height:1.55;";
      hint.textContent = t("hint");
      msg.appendChild(line); msg.appendChild(hint);
      btn.style.display = "inline-block";
      btn.onclick = check;
    }

    function check() {
      btn.style.display = "none";
      msg.innerHTML = '<span class="spinner"></span>';
      Promise.resolve(H.emit("check_session", { language: REPORTED }))
        .then(function (res) { if (res && res.ready) { toList(); } else { guide(res && res.reason); } })
        .catch(function (err) { guide(String((err && err.message) || err)); });
    }

    // Safety net: if check_session never answers, show the guidance instead of spinning.
    setTimeout(function () { guide(); }, 8000);
    check();
  }

  function onHomeyReady(homeyObj) { run(homeyObj); }
  document.addEventListener("DOMContentLoaded", function () { run(); });
  window.addEventListener("load", function () { run(); });
  (function poll(n) { if (started || n <= 0) return; run(); setTimeout(function () { poll(n - 1); }, 100); })(80);
</script>
